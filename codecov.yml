# Codecov configuration for the SDL-free Connect Four AI test suite.
# Coverage is measured only for connect4_ai.c (the pure-C minimax decision
# logic) -- the SDL rendering/game-loop code is excluded since it cannot run
# headless in CI.
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, flags"
  require_changes: true

# Only the unit-tested AI module is in scope.
ignore:
  - "tests/vendor/**"
  - "main.c"
  - "game_loop.c"
  - "game_state.c"
  - "world.c"
  - "player.c"
  - "enemy.c"
  - "ui.c"
  - "menu_keyboard.c"
  - "minigame*.c"
  - "puzzle*.c"
  - "timer.c"
  - "utils.c"
